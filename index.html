</style></head><body><header><a href="#" id="home">底色来信 <span>INNER COLORS</span></a><span>TF FAMILY · 04</span></header><main><div class="topline"><span>一份关于你的温柔观察</span><span>VOL. 01 / 2026</span></div><h1>测测你与TF家族四代练习生有哪些相似的人物底色</h1><section id="app" aria-live="polite"></section><details id="notes"><summary>关于这份测试 · 资料与解读说明 ↗</summary><div id="sources"></div></details></main><footer>每一种底色，都有自己的光。<br><span>非官方 · 兴趣向自我探索 · 无需登录 · 答案仅保存在本次页面内存</span></footer><script>// 五个编辑维度：主动社交、秩序计划、情感表达、探索创意、行动推进。
const dimensions=['主动联结','秩序计划','情感表达','探索创意','行动推进'];
const questions=[
['社交 · 初次见面','刚进一个不熟悉的班级或社团，你通常会……',0,['先向身边的人打招呼，聊两句','有人搭话就自然聊开','先观察，找到合适的话题再开口','先做自己的事，慢慢熟悉大家']],
['社交 · 相处距离','朋友临时约你参加一个大多是陌生人的聚会，你更可能……',0,['很期待认识新朋友','问问有哪些活动，再决定','希望有熟人一直陪着','更愿意改成几个熟人的小聚']],
['压力 · 调整情绪','一次考试或展示没发挥好，当天你更想……',2,['找信任的人说说心里话','先发消息聊两句，再休息','自己听歌或散步，之后再说','先独处整理好，不急着讲']],
['受挫 · 重新开始','练了很久的一项技能还是卡住，你通常……',4,['拆开难点，今天就再试一次','问问会的人，换个方法试','先停一下，状态好了再练','缓几天，等想继续时再说']],
['做事 · 计划程度','下周要交一份作业或方案，你习惯……',1,['提前分好每天做什么','先定截止点，留些机动时间','想到哪一步就先做哪一步','等临近截止，集中完成']],
['做事 · 临时变化','原定的周末安排突然取消，你会……',1,['尽快排好替代方案','保留主要目标，调整细节','随手找一件想做的事','难得空下来，就顺着心情过']],
['日常 · 空闲时刻','难得有半天自己的时间，你最想……',3,['试试没接触过的创作或新玩法','逛逛展览、听新歌找灵感','重温熟悉的书、歌或节目','按平时习惯休息，舒服就好']],
['日常 · 小习惯','睡前突然想到明天有件重要的事，你会……',1,['立刻列清单、准备好要带的东西','设个提醒，确认关键事项','在心里记一下就好','明早起床后再处理']],
['成长 · 学业与工作','选课、选专业或挑选未来方向时，你更重视……',3,['能否探索新领域，表达自己的想法','有没有持续学习和尝试的空间','是否适合已有的能力和节奏','路径是否清楚，生活是否稳定']],
['成长 · 面对目标','你给自己定下一个有点难的目标之后，通常……',4,['马上开始，边做边修正','找个小切口，稳步坚持','先收集经验，准备充分再动','等真正有把握了再启动']],
['喜欢 · 表达心意','对一个人有好感，你更接近哪一种表达？没有经历也可按想象选。',2,['找合适的机会直接说出喜欢','主动关心，让对方感受到','记住小事，用行动慢慢表达','先放在心里，确认彼此感受']],
['亲情 · 关心家人','家人问起你最近累不累，你一般会……',2,['把开心和委屈都聊一聊','说说近况，也听听他们的事','先讲好的，难处想好了再说','不太会说，但会用小事关心他们']],
['处事 · 团队卡壳','小组讨论很久还没决定下一步，你倾向于……',4,['整理选项，提议先试一个','接下自己能做的部分，推动进展','再听听大家顾虑，帮忙补充','等方向明确，再认真执行']],
['处事 · 意见不同','和朋友对同一件事意见不同，你常常会……',2,['坦诚说出感受，也邀请对方说','用温和的话把分歧聊开','先想清楚理由，之后再聊','给彼此一些空间，暂时不展开']],
['能量 · 独处与热闹','连续忙了一周后，最能让你恢复的是……',0,['约朋友出去，热热闹闹地玩','和两三个熟悉的人聊天','自己待一会儿，再见亲近的人','一整段不被打扰的独处时间']],
['能量 · 熟人之间','在熟悉的朋友面前，你通常是……',0,['主动找话题、带动气氛的人','很愿意接话，也会分享日常','话不多，但偶尔一句很有意思','更喜欢听大家说，安静陪着']],
['兴趣 · 打开世界','如果有机会免费体验一项活动，你更愿意选……',3,['即兴创作、摄影或编曲','尝试一项陌生的运动或手作','把喜欢的乐器或运动学得更扎实','熟悉又放松的阅读或观影']],
['兴趣 · 遇见新事物','听到一种没听过的观点或音乐风格，你会……',3,['主动找资料，想试着做点什么','愿意多了解，再看看喜不喜欢','先看看和已有兴趣有没有关联','更愿意把时间留给已经喜欢的事']],
['印象 · 别人眼中的你','朋友遇到需要马上处理的麻烦，会想到你是因为……',4,['你能快速抓重点，开始解决','你愿意一起想办法并行动','你能细致检查，帮忙避开疏漏','你会耐心陪着，让人安心']],
['印象 · 你的节奏','熟悉你的人更可能说……',1,['你做事有条理，很少临时赶工','你有自己的节奏，重要的事靠得住','你灵活随和，不喜欢排得太满','你常有临时的好点子，喜欢自由']]
].map(([category,title,d,options])=>({category,title,d,options}));
// 原型与数字均为本测试的编辑设计，不是人物心理测量结果。
const profiles=[
['官俊臣','把坚持过成日常',[3,4,2,2,3.5],'运动与训练经历','你愿意把难题拆成一步一步。|不急着被看见，也会认真往前。|像反复练习的一个动作，|你的坚持，终会长成自己的底气。'],
['张桂源','热爱有温度',[4,2,3,4,4],'篮球、魔术等兴趣线索','你的热情里，藏着认真生活的心。|愿意尝试，也愿意为喜欢的事投入。|看起来明亮的那一面，|也需要被轻轻接住、好好珍惜。'],
['张函瑞','把心事唱给世界',[3,4,4,3,3],'音乐与歌唱经历','你在意的，从来不只是做完一件事。|还有表达有没有抵达，心意有没有被听见。|细腻让你偶尔想得多一些，|也让你的认真，带着柔软的回声。'],
['王橹杰','慢慢积累的光',[2,4,3,3,2],'阅读与音乐兴趣线索','你喜欢给心里留一块安静的地方。|在那里，喜欢的事可以慢慢生长。|不必用热闹证明自己的存在，|细水长流，也是很有力量的答案。'],
['王烁然','把灵感写成自己的话',[2,2,3,4,4],'公开音乐创作与本人动态','你不满足于只是听见世界。|也想把自己的感受，变成一点作品。|一个念头、一段旋律，都值得留下，|你的表达，会带你找到自己的位置。'],
['左奇函','细节里有小宇宙',[3,3,2,4,3],'摄影、积木与乐器兴趣线索','你对世界有自己的观察角度。|喜欢从细节里，拼出完整的画面。|有些在意不一定立刻说出口，|但你认真留下的瞬间，自有分量。'],
['陈奕恒','让感受流动起来',[4,2,4,3,3],'语言、舞蹈兴趣及感性表达线索','你愿意让感受成为交流的入口。|遇见喜欢的人和事，会想靠近一点。|表达并不总要完美才值得开始，|真诚地回应，本身就很动人。'],
['杨博文','安静也有自己的热量',[1,3,2,3,4],'兴趣与紧张时的小习惯线索','你有时需要先和自己待一会儿。|再把认真，慢慢放进喜欢的事情里。|不急着解释每一种心情，|只愿每一步，都更靠近心里的方向。'],
['杨涵博','留一片自己的晴空',[1,3,1,2,3],'内向自述、数学与运动兴趣线索','你珍惜不被催促的相处。|可以安静想事，也可以自在发呆。|不必每次都把心情翻译成语言，|愿有人懂你的留白，也尊重你的节奏。'],
['张奕然','先出发，再看风景',[3,4,2,2,4],'尽早完成任务、运动与休息习惯线索','你更愿意把想法放进具体的一天。|完成一点，心里就踏实一点。|累的时候，也允许自己停下来，|好好休息，是为了更自在地继续。'],
['聂玮辰','好奇里也有分寸',[2,3,2,4,2],'悬疑、动漫及旅行兴趣线索','你对未知有好奇，也尊重自己的边界。|想走得远一点，也想走得安心。|勇敢可以是小小的一次尝试，|不用勉强自己，就已经在长大。'],
['陈思罕','把日常收进镜头',[2,2,3,4,2],'摄影相关公开报道；资料较少','你愿意给普通日常多留一点目光。|一张照片，也能装下一段心情。|那些别人匆匆走过的片刻，|在你的观察里，慢慢有了温度。'],
['魏子宸','安静地把日子想明白',[2,4,2,3,2],'阅读、文字沟通偏好与乐观自述线索','你喜欢把话想清楚，再温和地说。|也会给平凡日子，找一点轻松的理由。|认真和乐观，可以同时住在心里，|不用很喧哗，也能给生活添一束光。'],
['李煜东','一步一步也是向前',[1,3,2,2,4],'练习成长相关二手报道；资料较少','你愿意给还不熟练的自己一点时间。|今天多懂一点，明天再走一步。|成长从来不只有耀眼的瞬间，|每一次愿意继续，都值得被温柔记住。'],
['陈浚铭','小事也值得开心',[4,2,4,2,3],'食物、宠物与乐于助人的自述线索','你能从小小的日常里，接住快乐。|一顿喜欢的饭，一次真诚的回应。|这份愿意靠近生活的心，|会把普通的一天，也照得亮一点。']
].map(([name,tag,v,basis,poem])=>({name,tag,v,basis,poem:poem.split('|')}));

const app=document.querySelector('#app');let answers=Array(20).fill(null),step=0;
const anchors=['主动发起联结','按计划安排事情','直接表达感受','尝试新鲜事物','尽快推动行动'];
const soft=['慢慢熟悉关系','为生活保留弹性','先在心里整理感受','深耕熟悉的兴趣','先观察再稳步推进'];
function scrollPageTop(){window.scrollTo({top:0,behavior:'instant'})}
function cover(){app.innerHTML=`<section class="card hero"><div class="eyebrow">20 个生活片刻 · 遇见你的底色</div><div class="art" aria-hidden="true"><i class="petal"></i><i class="petal"></i><i class="petal"></i></div><h2>原来，我们有<br>相似的光。</h2><p class="intro">从你习惯的相处方式，到面对世界的姿态。<br>在少年的成长线索里，读一读自己的底色。</p><div class="chips"><span>20 道情境选择</span><span>约 3–5 分钟</span><span>15 种底色来信</span></div><button class="primary wide" id="start">开启我的底色来信　↗</button><p class="fine">选最近的自己，不必选“更好的答案”。<br>兴趣向测试，非心理诊断；结果为公开线索启发的创作解读。</p></section>`;document.querySelector('#start').onclick=()=>{answers.fill(null);step=0;question();scrollPageTop()}}
function question(){const q=questions[step];app.innerHTML=`<section class="card"><div class="qmeta"><span>QUESTION ${String(step+1).padStart(2,'0')}</span><span>${step+1} / 20</span></div><div class="progress"><i style="width:${(step+1)*5}%"></i></div><div class="eyebrow">${q.category}</div><h2 class="question" tabindex="-1">${q.title}</h2><div class="options" role="group" aria-label="选择最接近你的答案">${q.options.map((o,i)=>`<button class="option ${answers[step]===i?'selected':''}" aria-pressed="${answers[step]===i}" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="nav"><button class="back" id="prev">${step?'← 上一题':'← 回到封面'}</button><button class="primary" id="next" ${answers[step]===null?'disabled':''}>${step===19?'查看我的底色来信　↗':'下一题　→'}</button></div><p class="fine">没有标准答案，选最接近的一项就好。</p></section>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.i;question()});document.querySelector('#prev').onclick=()=>{if(step){step--;question()}else cover();scrollPageTop()};document.querySelector('#next').onclick=()=>{if(answers[step]===null)return;if(step<19){step++;question();app.querySelector('h2').focus()}else result();scrollPageTop()}}
function score(a){if(a.length!==20||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('请先完成全部题目');let v=Array(5).fill(0),n=Array(5).fill(0);questions.forEach((q,i)=>{v[q.d]+=4-a[i];n[q.d]++});return v.map((x,i)=>x/n[i])}
function rank(v){return profiles.map((p,i)=>({p,i,dist:p.v.reduce((s,x,d)=>s+(x-v[d])**2,0)})).sort((a,b)=>a.dist-b.dist||a.i-b.i)}
function result(){const v=score(answers),r=rank(v),p=r[0].p,far=r.at(-1).p;const similar=v.map((x,i)=>({i,d:Math.abs(x-p.v[i])})).sort((a,b)=>a.d-b.d);const delta=v.map((x,i)=>({i,d:Math.abs(x-p.v[i])})).sort((a,b)=>b.d-a.d)[0];let same=similar.slice(0,2).map(({i})=>v[i]>=2.5?anchors[i]:soft[i]).join('、');const diff=delta.d<.25?'这次五个维度与你匹配的编辑原型较接近；真实的你与真实的他，仍有许多题目无法涵盖的差异。':`在「${dimensions[delta.i]}」上，${v[delta.i]>p.v[delta.i]?"你比这个编辑原型更倾向于"+anchors[delta.i]+"；原型在这方面留有更多弹性":"这个编辑原型比你更倾向于"+anchors[delta.i]+"；你为另一种处理方式保留了更多空间"}。`;
